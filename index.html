<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>학습 플래너</title>
<style>
:root{--ink:#111111;--mut:#7d828b;--line:#d9dbe0;--soft:#f3f4f6;--err:#c0392b}
*{box-sizing:border-box;border-radius:0;margin:0}
html,body{height:100%}
body{font-family:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;color:var(--ink);background:#fff;font-size:15px;display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;border:1.5px solid var(--ink);background:#fff;min-height:44px;padding:0 10px}
textarea{padding:8px 10px;min-height:96px;width:100%}
button{cursor:pointer}
button:disabled,input:disabled{color:var(--mut);border-color:var(--line);cursor:default}
input[type=checkbox],input[type=radio]{min-height:0;border:0;padding:0;width:20px;height:20px;accent-color:#111}
input[type=color]{padding:2px;width:56px}
a{color:var(--ink)}
:focus-visible{outline:3px solid #111;outline-offset:2px}
h3{font-size:16px;margin-bottom:8px}
.pri{background:#111;color:#fff}
.mut{color:var(--mut)}.sm{font-size:13px}.err{color:var(--err)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.wrap{flex-wrap:wrap}
.row>input,.row>select{flex:1;min-width:0}
.f{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:14px}
.rd{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px}
.rg{display:flex;flex-wrap:wrap;gap:4px 14px}
.pad{padding:12px;overflow:auto;height:100%}
.bx{border:1.5px solid var(--ink);padding:10px;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.top{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1.5px solid var(--ink);padding-top:max(6px,env(safe-area-inset-top))}
.dd{border:0;padding:0;display:flex;align-items:baseline;gap:8px;min-height:44px;background:none;text-align:left}
.ddn{font-size:34px;font-weight:700;line-height:1}.ddl{font-size:14px;color:var(--mut)}
.pg{margin-left:auto;font-size:14px}.sy{font-size:12px;color:var(--mut);min-width:84px;text-align:right}
#main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.bn{display:flex;border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.bn button{flex:1;border:0;border-right:1px solid var(--line);min-height:50px;font-size:13px;padding:0 2px}
.bn button:last-child{border-right:0}
.bn button[aria-current=page]{background:#111;color:#fff}
.wbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.week{flex:1;min-height:0;display:flex;overflow-x:auto}
.col{flex:1 0 156px;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.col:last-child{border-right:0}
.ch{background:#111;color:#fff;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;font-size:13px}
.cb{flex:1;overflow-y:auto}
.it{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#fff}
.it.dn{background:var(--soft)}
.tx{flex:1;text-align:left;border:0;background:transparent;min-height:44px;padding:8px;font-size:14px;line-height:1.35}
.tx small{display:block;color:var(--mut);font-size:11px}
.ck{width:48px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ck input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.ck span{width:26px;height:26px;border:1.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.ck input:checked+span{background:var(--c)}
.ck input:checked+span::after{content:'✓'}
.ck input:focus-visible+span{outline:3px solid #111;outline-offset:2px}
.lbl{background:#111;color:#fff;padding:5px 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.lbl.lt{background:var(--mut)}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #fff;flex:none}
.addb{width:100%;border:0;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.hl{padding:0 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hg{background:#a8f0a0}.hy{background:#fff176}
.tbtn{min-height:56px;font-size:18px;flex:1}
#modal .ov{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 8px 8px;z-index:20}
.md{background:#fff;border:1.5px solid var(--ink);width:100%;max-width:760px;max-height:94dvh;height:auto;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1.5px solid var(--ink)}
.mb{padding:10px 12px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:1.5px solid var(--ink)}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;font-size:14px;z-index:40;display:none;max-width:90vw}
.grid td,.grid th{text-align:center;font-size:11px;padding:3px;height:26px;min-width:44px}.gw{overflow:auto}
.chrow{border:1px solid var(--line);padding:6px;margin:6px 0}
.chrow .row{margin:4px 0}
.big{font-size:44px;font-weight:700}
.clk{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:10px}
.tdisp{font-size:72px;font-weight:700;text-align:center;border:0;background:none;min-height:0;width:100%}
.tdisp.over{color:var(--err)}
.chip{min-width:88px}.chip[aria-pressed=true]{background:#111;color:#fff}
@media (max-width:600px){.ddn{font-size:28px}.tdisp{font-size:56px}.ddl{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='planner-v1',UKEY='planner-undo-v1',TKEY='planner-timer-v1';
const DAYN=['월','화','수','목','금','토','일'];
const TPL={'수능용':[['국어','#f4a6ef'],['수학','#5fb6f2'],['영어','#7fe98d'],['사회·탐구1','#ffa94d'],['사회·탐구2','#fbe24d'],['한국사','#6ee7c8'],['면접·기타','#d9dbe0']],'내신용':[['국어','#f4a6ef'],['수학','#5fb6f2'],['영어','#7fe98d'],['과학','#ffa94d'],['사회','#fbe24d'],['기타','#d9dbe0']]};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mx=(a,b)=>a>b?a:b;
const r1=v=>Math.round(v*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const now=()=>Date.now();
const todayS=()=>fmt(new Date());
const amt=i=>i.a!=null?i.b-i.a+1:1;
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`).join('');
const hh=h=>(h>=24?'익일 ':'')+pad(h%24)+':00';

/* ===== 상태 ===== */
const defS=()=>({v:1,_rev:0,onboarded:false,settings:{ddays:[],mainD:null,subjects:[],timeMode:false,rest:[],dayW:['n','n','n','n','n','n','n'],behind:3,dismissed:0,cap:0},plans:[],items:[],schedules:[],active:null,del:{},log:[]});
let S=loadS();
function loadS(){const d=defS();try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})})}}catch(e){}return d}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function commit(){S._rev=(S._rev||0)+1;saveS();render()}
const subs=()=>S.settings.subjects;
const sj=id=>subs().find(x=>x.id===id);
const sc=id=>(sj(id)||{}).color||'#d9dbe0';
const sn=id=>(sj(id)||{}).name||'기타';
const so=id=>{const k=subs().findIndex(x=>x.id===id);return k<0?999:k};
const activeSch=()=>S.schedules.find(x=>x.id===S.active)||null;
function learnToday(){const n=new Date(),a=S.settings.timeMode?activeSch():null,d=new Date(n);if(a&&a.end>24&&n.getHours()<a.end-24)d.setDate(d.getDate()-1);return fmt(d)}
const mondayOf=s=>add(s,-dow(s));
function mainD(){const l=S.settings.ddays;return l.find(x=>x.id===S.settings.mainD)||l[0]||null}
function ddText(){const m=mainD();if(!m)return{name:'D-day를 설정하세요',n:'D-?'};const n=diff(todayS(),m.date);return{name:m.name,n:n>0?'D-'+n:n===0?'D-Day':'D+'+(-n)}}
function prog(){const l=S.items.filter(i=>!i.skip&&(!i.hid||i.done));return[l.filter(i=>i.done).length,l.length]}
const backlogOf=(st)=>{st=st||S;const t=learnToday();return st.items.filter(i=>!i.done&&!i.skip&&!i.hid&&i.d<t).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:so(x.s)-so(y.s))};
function itemsOn(d){return S.items.filter(i=>i.d===d&&!i.skip&&(!i.hid||i.done)).sort((x,y)=>so(x.s)-so(y.s)||(x.a||0)-(y.a||0)||x.u-y.u)}
function studyDays(f,t){const o=[],r=S.settings.rest;for(let d=f,n=0;d<=t&&n<800;d=add(d,1),n++)if(!r.includes(dow(d)))o.push(d);return o}
function snapUndo(){try{localStorage.setItem(UKEY,JSON.stringify({items:S.items,plans:S.plans,t:now()}))}catch(e){}}
function logAdd(msg){S.log=(S.log||[]).concat([{t:now(),msg}]).slice(-30)}

/* ===== 배분 알고리즘 ===== */
const DW={e:1,m:1.5,h:2},AW={s:.8,m:1,w:1.3},CAPW={f:1.3,n:1,b:.6};
function meta(p){const n=p.total|0,base=(p.ch&&p.ch.length)?1.5:1,w=new Array(n+2).fill(base),sk=new Array(n+2).fill(false),ci=new Array(n+2).fill(-1);(p.ch||[]).forEach((c,k)=>{for(let x=Math.max(1,c.a);x<=Math.min(n,c.b);x++){w[x]=(DW[c.df]||1.5)*(AW[c.ab]||1);sk[x]=!!c.sk;ci[x]=k}});return{w,sk,ci}}
function covered(st,pid,r){const s=new Set();st.items.forEach(i=>{if(i.pid===pid&&(i.done||i.skip)&&(i.r||1)===r&&i.a!=null)for(let x=i.a;x<=i.b;x++)s.add(x)});return s}
function segs(p,from){
  const out=[],tot=p.total;
  const mk=(f,t)=>{let d=studyDays(f,t);if(!d.length){d=studyDays(f,add(f,6));if(!d.length)d=[f]}return d};
  if(p.gt==='milestone'&&(p.ms||[]).length){
    const ms=[...p.ms].sort((x,y)=>x.date<y.date?-1:1);let pd=add(p.start,-1),pp=0;
    ms.forEach(m=>{const hi=Math.min(m.pt,tot);if(hi>=pp+1)out.push({days:mk(mx(add(pd,1),from),m.date),lo:pp+1,hi,r:1});pd=m.date;pp=Math.max(pp,m.pt)});
    return out}
  const hi=p.gt==='point'?Math.min(p.gp||tot,tot):tot;
  const end=p.gt==='daily'?add(from,730):(p.end<from?from:p.end);
  const all=mk(from,end),N=p.gt==='daily'?1:Math.max(1,p.rounds||1);
  for(let r=1;r<=N;r++){const a=Math.floor((r-1)*all.length/N),b=Math.floor(r*all.length/N),dd=all.slice(a,b);out.push({days:dd.length?dd:[all[all.length-1]],lo:1,hi,r})}
  return out}
function place(units,days,mode,p){
  const per=days.map(()=>[]);let left=[];
  if(!units.length)return{per,left};
  if(mode==='weekday'||mode==='custom'||mode==='ramp'||mode==='daily'){
    let k=0;
    days.forEach((d,i)=>{let n=0;if(mode==='weekday')n=+(p.wk&&p.wk[dow(d)])||0;else if(mode==='custom')n=+(p.cu&&p.cu[d])||0;else if(mode==='ramp')n=Math.max(0,Math.round((+p.r0||0)+(+p.rs||0)*i));else n=Math.max(1,+p.dn||1);
      for(let j=0;j<n&&k<units.length;j++)per[i].push(units[k++])});
    left=units.slice(k);return{per,left}}
  const useW=mode==='weighted',caps=days.map(d=>useW?(CAPW[S.settings.dayW[dow(d)]]||1):1);
  let blocks=[];
  if(p.kc){let cur=null;units.forEach(u=>{if(cur&&u.ci>=0&&cur.ci===u.ci&&u.p===cur.last+1){cur.us.push(u);cur.w+=useW?u.w:1;cur.last=u.p}else{cur={ci:u.ci,us:[u],w:useW?u.w:1,last:u.p};blocks.push(cur)}})}
  else blocks=units.map(u=>({us:[u],w:useW?u.w:1}));
  const W=blocks.reduce((s,b)=>s+b.w,0),C=caps.reduce((a,b)=>a+b,0);
  let pre=0,di=0,acc=0;const cum=caps.map(c=>(pre+=c));
  blocks.forEach(b=>{const mid=acc+b.w/2;while(di<days.length-1&&W*cum[di]/C<mid-1e-9)di++;per[di].push(...b.us);acc+=b.w});
  return{per,left}}
function runsOf(us,kc){const out=[];let c=null;us.forEach(u=>{if(c&&u.p===c.b+1&&(!kc||u.ci===c.ci)){c.b=u.p}else{c={a:u.p,b:u.p,ci:u.ci};out.push(c)}});return out}
function itemText(p,a,b,r,ci){const u=p.unit||'쪽',rng=a===b?a+u:a+'~'+b+u,rd=(p.rounds||1)>1&&p.gt!=='milestone'&&p.gt!=='daily'?r+'회독 ':'',cn=(p.kc&&ci>=0&&p.ch[ci])?p.ch[ci].n+' ':'';return p.name+' '+rd+cn+rng}
function buildItems(st,p,from,mode){
  const m=meta(p),out=[];let left=0;const md2=p.gt==='daily'?'daily':mode;
  segs(p,from).forEach(sg=>{
    const cov=covered(st,p.id,sg.r),units=[];
    for(let x=sg.lo;x<=sg.hi;x++){if(m.sk[x]||cov.has(x))continue;units.push({p:x,w:m.w[x],ci:m.ci[x]})}
    const res=place(units,sg.days,md2,p);
    if(res.left.length){left+=res.left.length;res.per[res.per.length-1].push(...res.left)}
    res.per.forEach((us,i)=>runsOf(us,p.kc).forEach(rn=>{const d=sg.days[i];out.push({id:uid(),pid:p.id,d,a:rn.a,b:rn.b,s:p.subj||'',t:itemText(p,rn.a,rn.b,sg.r,rn.ci),done:0,ed:0,o:d,r:sg.r,u:now()})}))});
  return{items:out,left}}
function regen(st,p,from,mode){
  const rm=st.items.filter(i=>i.pid===p.id&&!i.done&&!i.skip);
  st.items=st.items.filter(i=>!(i.pid===p.id&&!i.done&&!i.skip));
  if(st===S)rm.forEach(i=>{S.del[i.id]=now()});
  const r=buildItems(st,p,from,mode||p.mode);st.items.push(...r.items);return r}
function reflowEven(st,n){
  const t=learnToday(),bl=backlogOf(st),days=[];let d=t,g=0;const rest=S.settings.rest;
  while(days.length<Math.ceil(bl.length/n)+1&&g++<800){if(!rest.includes(dow(d)))days.push(d);d=add(d,1)}
  bl.forEach((i,k)=>{const nd=days[Math.floor(k/n)]||t;if(nd!==i.d){i.o=i.o||i.d;i.d=nd;i.u=now()}});
  return bl.length?(days[Math.floor((bl.length-1)/n)]||t):t}
function reflowW(st){
  const t=learnToday(),bl=backlogOf(st),pids=[...new Set(bl.filter(i=>i.pid).map(i=>i.pid))];
  pids.forEach(pid=>{const p=st.plans.find(x=>x.id===pid);if(p)regen(st,p,t,'weighted')});
  bl.filter(i=>!i.pid).forEach(i=>{i.o=i.o||i.d;i.d=t;i.u=now()})}
function avgDaily(st,p,t){let a=0;const ds=new Set();st.items.forEach(i=>{if(i.pid===p.id&&!i.done&&!i.skip&&i.d>=t){a+=amt(i);ds.add(i.d)}});const end=p.gt==='daily'?([...ds].sort().pop()||t):mx(p.end||t,t);return a/Math.max(1,studyDays(t,end).length)}
function behindOf(p){const t=learnToday();let late=0,ahead=0;S.items.forEach(i=>{if(i.pid!==p.id||i.skip)return;if(!i.done&&i.d<t)late+=amt(i);if(i.done&&i.d>t)ahead+=amt(i)});return ahead-late}
function daysBehind(){const bl=backlogOf();if(!bl.length)return 0;const t=learnToday(),fut=S.items.filter(i=>!i.done&&!i.skip&&!i.hid&&i.d>=t),ds=new Set(fut.map(i=>i.d));const avg=fut.length?fut.length/Math.max(1,ds.size):1;return bl.length/Math.max(1,avg)}
function planStat(p){let d=0,t=0;S.items.forEach(i=>{if(i.pid===p.id&&!i.skip){t+=amt(i);if(i.done)d+=amt(i)}});return{d,t}}
const curGP=p=>p.gt==='point'?(p.gp||p.total):p.gt==='milestone'?Math.max(0,...(p.ms||[]).map(m=>m.pt)):p.total;

/* ===== 시간 스케줄 ===== */
function boxTime(b,d){
  const w=dow(d),ex=(b.ex||{})[d];if(ex==='off')return null;let hit=false;
  if(b.rt==='weekly')hit=(b.days||[]).includes(w);
  else if(b.rt==='days')hit=(b.days||[]).includes(w)&&(!b.from||d>=b.from)&&(!b.to||d<=b.to);
  else if(b.rt==='monthly'){const dt=parse(d);hit=b.mm==='nth'?(w===+b.wd&&Math.ceil(dt.getDate()/7)===+b.nth):dt.getDate()===+b.md}
  if(!hit&&!ex)return null;
  if(ex)return ex;
  return (b.dt||{})[w]||{s:b.s,e:b.e}}
function gridHTML(s){
  const rows=[];
  for(let h=s.start;h<s.end;h++){let r=`<tr><th>${hh(h)}</th>`;
    for(let w=0;w<7;w++){const hit=s.boxes.filter(b=>(b.rt==='weekly'||b.rt==='days')&&(b.days||[]).includes(w)).find(b=>{const t=(b.dt||{})[w]||{s:b.s,e:b.e};return h>=t.s&&h<t.e});
      r+=hit?`<td style="background:${esc(hit.color)}">${esc(hit.name)}</td>`:'<td></td>'}
    rows.push(r+'</tr>')}
  return `<div class="gw"><table class="grid"><tr><th></th>${DAYN.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div><p class="mut sm">매달 반복 일정은 표에 나오지 않아요(실제 주간 화면에는 나와요).</p>`}

/* ===== 화면: 공통 ===== */
let view='week',wkStart=mondayOf(learnToday()),M=null,W=null,SC=null,BX=null,AD={},OB=null,evenN=null;
function render(){
  const f=document.activeElement,fk=f&&f.dataset&&f.dataset.act&&f.dataset.id?`[data-act="${f.dataset.act}"][data-id="${f.dataset.id}"]`:null;
  const sy=$$('.cb').map(e=>e.scrollTop),sx=($('.week')||{}).scrollLeft,ps=($('.pad')||{}).scrollTop;
  $('#app').innerHTML=hdr()+`<main id="main">${body()}</main>`+nav();
  $$('.cb').forEach((e,i)=>{e.scrollTop=sy[i]||0});
  if($('.week')&&sx)$('.week').scrollLeft=sx;
  if($('.pad')&&ps)$('.pad').scrollTop=ps;
  if(fk&&!M){const n=document.querySelector(fk);if(n)n.focus()}
  if(view==='clock'||view==='timer')wake();else unwake();
  if(view==='clock')startClock();
  if(view==='timer')tickT();
  checkBanner()}

  const s=T.sw,laps=s.laps||[];
  return `<div class="clk" style="justify-content:flex-start;overflow:auto">${chips}<div class="tdisp" id="tdisp">00:00.0</div><div class="row" style="width:min(520px,92vw)"><button class="tbtn" data-act="slap">${s.st==='run'?'랩':'리셋'}</button><button class="tbtn" data-act="sgo"><span class="hl ${s.st==='run'?'hy':'hg'}">${s.st==='run'?'정지':s.st==='stop'?'계속':'시작'}</span></button></div>${laps.length?`<table style="max-width:520px"><tr><th>랩</th><th>스플릿</th><th>전체</th></tr>${laps.slice().reverse().map(l=>`<tr><td>${l.n}</td><td>${mmss(l.split)}.${Math.floor(l.split%1000/100)}</td><td>${mmss(l.total)}.${Math.floor(l.total%1000/100)}</td></tr>`).join('')}</table>`:''}</div>`}
function swNow(){const s=T.sw;return s.st==='run'?s.acc+(now()-s.start):s.acc}
function tickT(){
  const e=$('#tdisp');if(!e||view!=='timer')return;
  if(T.mode==='sw'){const v=swNow();e.textContent=mmss(v)+'.'+Math.floor(v%1000/100);return}
  let rem=T.st==='run'?T.end-now():T.st==='pause'?T.rem:T.dur;
  if(rem<0){e.textContent='+'+mmss(-rem);e.classList.add('over')}else{e.textContent=mmss(Math.ceil(rem/1000)*1000);e.classList.remove('over')}}
setInterval(tickT,200);
setInterval(()=>{if(!M&&(view==='week'||view==='backlog')&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()},60000);

function setPath(o,path,v){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++){if(c[k[i]]==null)c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=v}

function onField(e){
  const el=e.target,d=el.dataset;if(!d)return;
  if(d.w!==undefined&&W){
    if(d.w==='unk'){W.min=el.checked?null:5}
    else{const v=val(el);if(v===undefined)return;setPath(W,d.w,v)}

  if(d.sc!==undefined&&SC){setPath(SC,d.sc,val(el));if(d.sc==='start'){SC.start=+SC.start;if(SC.end<=SC.start||SC.end>SC.start+24)SC.end=Math.min(SC.start+24,29)>SC.start+12?Math.min(SC.start+16,29):Math.min(SC.start+24,29);SC.boxes=SC.boxes.filter(b=>b.s>=SC.start&&b.e<=SC.end)}if(d.sc==='end'){SC.end=+SC.end;SC.boxes=SC.boxes.filter(b=>b.e<=SC.end)}if(e.type==='change'&&d.rr!==undefined)renderModal();return}
  if(d.bx!==undefined&&BX){
    if(d.bx==='days'){const i=+d.i,a=BX.days||[],k=a.indexOf(i);if(el.checked&&k<0)a.push(i);if(!el.checked&&k>=0)a.splice(k,1);BX.days=a;if(e.type==='change')renderModal();return}
    const v=val(el);setPath(BX,d.bx,['s','e','nth','wd','md'].includes(d.bx)||/^dt\.\d\.[se]$/.test(d.bx)?+v:v);
    if(d.bx==='s'&&BX.e<=BX.s)BX.e=BX.s+1;
    if(/^dt\.\d\.s$/.test(d.bx)){const w=d.bx.split('.')[1];if(BX.dt[w].e===undefined||BX.dt[w].e<=BX.dt[w].s)BX.dt[w].e=BX.dt[w].s+1}

    if(e.type==='change'&&(d.rr!==undefined||/^dt\./.test(d.bx)))renderModal();return}
  if(d.ad!==undefined&&M&&M.t==='adj'){const dr=adjDraftOf(M.pid);const v=val(el);if(d.ad.startsWith('sk.'))dr.sk[+d.ad.slice(3)]=v;else dr[d.ad]=v;dr.mod=true;return}
  if(d.ob!==undefined&&OB){obSync();if(d.ob==='tpl'){if(el.checked)OB.tpl=el.value;renderModal()}else if(d.ob==='rest'){const i=+d.i,k=OB.rest.indexOf(i);if(el.checked&&k<0)OB.rest.push(i);if(!el.checked&&k>=0)OB.rest.splice(k,1)}else if(d.ob==='tm')OB.tm=el.checked;return}
  if(e.type!=='change')return;

    case 'rest':{const i=+d.i,k=s.rest.indexOf(i);if(el.checked&&k<0)s.rest.push(i);if(!el.checked&&k>=0)s.rest.splice(k,1);commit();break}

    case 'active':S.active=el.value;commit();break;

function exportText(){
  const by={};S.items.forEach(i=>{if(i.skip)return;(by[i.d]=by[i.d]||[]).push(i)});
  return Object.keys(by).sort().map(d=>md(d)+'|'+by[d].map(i=>`${sn(i.s)}@${i.hid?'hid':'x'} ${i.t}`).join('|')).join('\n')}
function exportCSV(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';return '날짜,과목,내용,완료\n'+S.items.filter(i=>!i.skip).sort((x,y)=>x.d<y.d?-1:1).map(i=>[i.d,q(sn(i.s)),q(i.t),i.done?'O':''].join(',')).join('\n')}
function subjByTok(t){t=String(t).trim();if(!t)return '';const x=subs().find(s=>s.id===t||s.name===t)||subs().find(s=>s.name.startsWith(t));return x?x.id:''}
function doImport(txt){
  txt=String(txt||'').trim();if(!txt)return toast('가져올 내용을 붙여넣어 주세요');
  if(txt[0]==='{'){try{const o=JSON.parse(txt);if(!o.settings||!Array.isArray(o.items))throw 0;if(!confirm('현재 데이터를 백업 내용으로 전체 교체할까요?'))return;const rev=S._rev;S=Object.assign(defS(),o);S._rev=rev;closeModal();commit();toast('백업을 복원했어요')}catch(e){toast('JSON 형식이 올바르지 않아요')}return}
  let n=0;const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
  lines.forEach(l=>{
    if(l.includes('|')){const parts=l.split('|'),d=pdate(parts[0]);if(!d)return;
      parts.slice(1).forEach(e=>{const m=e.trim().match(/^(?:([^@\s]+)@(\S+)\s+)?([\s\S]*)$/);if(!m||!m[3].trim())return;S.items.push({id:uid(),pid:null,d,a:null,b:null,s:subjByTok(m[1]||''),t:m[3].trim(),done:0,ed:0,hid:m[2]==='hid'?1:0,o:d,r:1,u:now()});n++})}
    else{const c=l.split(','),d=pdate(c[0].replace(/"/g,''));if(!d||c.length<3)return;const t=c.slice(2).join(',').replace(/^"|"$/g,'').replace(/""/g,'"').trim();if(!t)return;S.items.push({id:uid(),pid:null,d,a:null,b:null,s:subjByTok(c[1].replace(/"/g,'')),t,done:0,ed:0,o:d,r:1,u:now()});n++}});
